name: One-shot update validation hotfix

on:
  push:
    branches:
      - fix/update-validation-timeout-9.1.7

permissions:
  contents: write

concurrency:
  group: one-shot-update-validation-hotfix
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/update-validation-timeout-9.1.7

      - name: Patch smoke-test budget and bump release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourcePath = 'src/mining-auto.ahk'
          $text = [System.IO.File]::ReadAllText($sourcePath)
          $pattern = '(?ms)(RunUiSmokeTest\(\)\s*\{\s*global State\s*)deadline := MonotonicMs\(\) \+ 15000'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one RunUiSmokeTest 15-second readiness budget, found $($matches.Count)."
          }
          $replacement = '$1; Keep the in-app readiness budget consistent with the updater''s 60 s validation window.`r`n    ; A cold WebView2 profile on a busy FiveM/GTA machine can legitimately exceed 15 s.`r`n    deadline := MonotonicMs() + 38000'
          $text = [regex]::Replace($text, $pattern, $replacement, 1)
          [System.IO.File]::WriteAllText($sourcePath, $text, [System.Text.UTF8Encoding]::new($false))

          $oldVersion = '9.1.6'
          $newVersion = '9.1.7'
          $paths = @(& git grep -l -F $oldVersion -- .)
          if ($LASTEXITCODE -ne 0 -or $paths.Count -eq 0) {
            throw "No tracked $oldVersion version markers were found."
          }
          foreach ($path in $paths) {
            if ($path -eq '.github/workflows/one-shot-update-validation-hotfix.yml') { continue }
            [byte[]]$bytes = [System.IO.File]::ReadAllBytes($path)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $offset = if ($hasBom) { 3 } else { 0 }
            $value = [System.Text.Encoding]::UTF8.GetString($bytes, $offset, $bytes.Length - $offset)
            if (-not $value.Contains($oldVersion)) { continue }
            $value = $value.Replace($oldVersion, $newVersion)
            [System.IO.File]::WriteAllText($path, $value, [System.Text.UTF8Encoding]::new($hasBom))
          }

          $patched = [System.IO.File]::ReadAllText($sourcePath)
          if ($patched -notmatch 'global AppVersion := "9\.1\.7"') {
            throw 'AppVersion was not bumped to 9.1.7.'
          }
          if ($patched -notmatch 'RunUiSmokeTest\(\)[\s\S]{0,500}MonotonicMs\(\) \+ 38000') {
            throw 'RunUiSmokeTest readiness budget was not patched to 38 seconds.'
          }
          if ($patched -match 'RunUiSmokeTest\(\)[\s\S]{0,500}MonotonicMs\(\) \+ 15000') {
            throw 'The obsolete 15-second UI readiness budget is still present.'
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed.' }

      - name: Download and verify pinned build tools
        shell: pwsh
        run: .\scripts\Bootstrap-Tools.ps1

      - name: Full v9.1.7 validation build
        shell: pwsh
        timeout-minutes: 18
        run: .\scripts\Build.ps1 -Version 9.1.7 -SkipToolBootstrap

      - name: Commit validated hotfix and remove one-shot workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/one-shot-update-validation-hotfix.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged diff validation failed.' }
          git commit -m 'Fix false rollback during slow WebView2 startup'
          if ($LASTEXITCODE -ne 0) { throw 'Hotfix commit failed.' }
          git push origin HEAD:fix/update-validation-timeout-9.1.7
          if ($LASTEXITCODE -ne 0) { throw 'Hotfix push failed.' }
