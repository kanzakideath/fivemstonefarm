name: FishingPilot 0.4.0 verified nearby storage
on:
  push:
    branches: [feat/fishing-verified-storage-0.4.0]
    paths: [.github/workflows/fishing040-build.yml]
permissions:
  contents: write
concurrency:
  group: fishing040-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Integrate reviewed source with strict versioned patch checks
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/fishing040 | Out-Null
          foreach($script in @('Upgrade040.py','UpgradeUi040.py','Finalize040.py','ExistingCatch040.py','Harden040.py','Review040.py')) {
            python "portable/$script"
            if($LASTEXITCODE -ne 0){throw "Integration failed: $script"}
          }
          Copy-Item portable/README040.txt portable/README.txt -Force
          node --check portable/SceneProbe.js
          if($LASTEXITCODE -ne 0){throw 'Scene syntax failed'}
          node --check portable/ui/app.js
          if($LASTEXITCODE -ne 0){throw 'UI syntax failed'}
      - name: Windows executable, real WebView2 and production expression tests
        shell: pwsh
        run: ./portable/Verify040.ps1
      - name: Preserve passing readable source on isolated branch only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- portable
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m 'FishingPilot 0.4.0: tested recognition and registered nearby storage'
            if($LASTEXITCODE -ne 0){throw 'Source commit failed'}
            git push origin HEAD:feat/fishing-verified-storage-0.4.0
            if($LASTEXITCODE -ne 0){throw 'Source branch changed; reconcile before distribution'}
          }
      - name: Package exact tested binary and verify ZIP roundtrip
        shell: pwsh
        run: |
          python portable/Package040.py
          if($LASTEXITCODE -ne 0){throw 'Packaging or hash verification failed'}
      - name: Capture test evidence and attempted source
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/fishing040 | Out-Null
          @'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('artifacts/fishing040/attempted-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('portable').rglob('*'):
              if p.is_file() and not any(v in p.parts for v in ('dist','node_modules','obj','bin','vendor')):z.write(p,p.as_posix())
          '@ | python -
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fishing040-evidence
          path: |
            artifacts/fishing040/
            portable/dist/test-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Downloadable tested build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fishing040-download
          path: artifacts/fishing040-download/
          retention-days: 14
          if-no-files-found: error
