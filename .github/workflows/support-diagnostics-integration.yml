name: Validate diagnostic export and micro drift
on:
  push:
    branches: [fix/support-diagnostics-9.1.13]
    paths: [.github/workflows/support-diagnostics-integration.yml]
permissions:
  contents: write
concurrency:
  group: support-diagnostics-integration-9.1.13
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Wire diagnostics to exact tested baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/Integrate-SupportDiagnostics.py
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed source boundaries changed.' }
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed.' }
      - name: Compile and test real journal, exporter, final EXE and old updater compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/support-diag | Out-Null
          Start-Transcript artifacts/support-diag/build.txt
          try { ./scripts/Build.ps1 -Version 9.1.13 } finally { Stop-Transcript }
      - name: Preserve real native input tests for tiny repeated drift
        shell: pwsh
        run: ./scripts/Test-WashPositionDesktop.ps1 -OutputDirectory artifacts/support-diag
      - name: Render actual overlay and test visible support actions at four sizes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result=Join-Path $PWD 'artifacts/support-diag/native-overlay-result.txt'
          $image=Join-Path $PWD 'artifacts/support-diag/native-overlay.png'
          $p=Start-Process -FilePath (Join-Path $PWD 'build/staging/LocalNavigation.exe') -ArgumentList @('overlay-preview',"`"$result`"","`"$image`"") -PassThru
          if(-not $p.WaitForExit(15000)){$p.Kill();throw 'Overlay timeout.'}
          if(-not(Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne 'OVERLAY_PREVIEW_OK'){throw 'Overlay failed.'}
          python -m pip install playwright==1.57.0
          if($LASTEXITCODE -ne 0){throw 'Playwright install failed.'}
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if(-not(Test-Path $edge)){$edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe'}
          if(Test-Path $edge){python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/support-diag}
          else {python -m playwright install chromium; if($LASTEXITCODE -ne 0){throw 'Browser install failed.'}; python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/support-diag}
          if($LASTEXITCODE -ne 0){throw 'Support/route UI interactions failed.'}
      - name: Retain exactly tested source and remove temporary integration tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item scripts/Integrate-SupportDiagnostics.py,.github/workflows/support-diagnostics-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/diagnostics.ahk src/diagnostics/Diagnostics.cs src/mining-auto.ahk src/wash-position.ahk src/ui-host/Protocol.cs src/ui-web/src/app.js src/ui-web/src/app.css src/ui-web/src/index.html scripts/Build.ps1 scripts/ui-tests/Test-RouteSetupBrowser.py docs/DIAGNOSTICS.md docs/RELEASE_v9.1.13.md docs/VALIDATION_v9.1.13.md scripts/Integrate-SupportDiagnostics.py .github/workflows/support-diagnostics-integration.yml
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if($LASTEXITCODE -ne 0){throw 'Staged diff failed.'}
          git commit -m 'Add persistent bounded diagnostics and user-controlled redacted support ZIP'
          if($LASTEXITCODE -ne 0){throw 'Source commit failed.'}
          git push origin HEAD:fix/support-diagnostics-9.1.13
          if($LASTEXITCODE -ne 0){throw 'Branch changed; do not force push.'}
          git rev-parse HEAD | Set-Content artifacts/support-diag/SOURCE.txt
          git archive --format=zip -o artifacts/support-diag/tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: support-diagnostics-evidence
          path: |
            artifacts/support-diag/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: support-diagnostics-9.1.13-candidate
          path: dist/ai-miner-win-x64.exe
          retention-days: 14
          if-no-files-found: error
