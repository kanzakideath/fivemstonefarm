name: Export pending EXE review
on:
  push:
    branches: [fix/exe-only-routes-and-voices]
    paths: [.github/workflows/export-exe-review.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize proposed patch without committing
        shell: python
        run: |
          import base64, gzip, hashlib, pathlib, subprocess, sys, zipfile
          root=pathlib.Path('scripts/exe-only-repair')
          raw=''.join((root/f'patch.part{n:02}').read_text().strip() for n in range(1,5))
          patch=gzip.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='2787a0af74f61753fd563634f9d9d9013e7e720b50b5c1ef80dd976015b528a8'
          path=pathlib.Path('.git/review.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--cached','--check',str(path)],check=True)
          subprocess.run(['git','apply','--cached',str(path)],check=True)
          subprocess.run(['git','checkout-index','--all','--force'],check=True)
          subprocess.run([sys.executable,str(root/'refine.py')],check=True)
          subprocess.run([sys.executable,str(root/'fix-ahk-command-continuation.py')],check=True)
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('exe-review-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  if name and pathlib.Path(name).is_file(): z.write(name,name)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exe-review-source
          path: exe-review-source.zip
          retention-days: 3
          if-no-files-found: error
