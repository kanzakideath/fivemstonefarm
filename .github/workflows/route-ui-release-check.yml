name: Route UI release check
on:
  push:
    branches: [fix/route-setup-overlay-9.1.9]
    paths: [.github/workflows/route-ui-release-check.yml]
permissions:
  contents: write
concurrency:
  group: route-ui-release-check
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed source repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ([IO.File]::ReadAllText('src/ui-web/src/index.html').Contains('id="screen-routes"'))) {
            python scripts/route-ui-repair/prepare.py
            if ($LASTEXITCODE -ne 0) { throw 'Preparation failed.' }
          }
          python scripts/route-ui-repair/final.py
          if ($LASTEXITCODE -ne 0) { throw 'Exact route command correction failed.' }
          New-Item -ItemType Directory -Force artifacts/route-ui | Out-Null
      - name: Full Windows build and executable validation
        shell: pwsh
        timeout-minutes: 12
        run: |
          $ErrorActionPreference = 'Stop'
          $stdout = Join-Path $PWD 'artifacts/route-ui/build.stdout.txt'
          $stderr = Join-Path $PWD 'artifacts/route-ui/build.stderr.txt'
          $proc = Start-Process -FilePath (Get-Process -Id $PID).Path -ArgumentList @('-NoProfile','-File','scripts/Build.ps1','-Version','9.1.9') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          $watch = [Diagnostics.Stopwatch]::StartNew()
          while (-not $proc.WaitForExit(10000)) {
            Write-Host ('Build elapsed seconds: ' + [int]$watch.Elapsed.TotalSeconds)
            if (Test-Path $stdout) { Get-Content $stdout -Tail 8 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 5 }
            if ($watch.Elapsed.TotalMinutes -ge 10) { & taskkill /PID $proc.Id /T /F; throw 'Build timeout.' }
          }
          Get-Content $stdout
          Get-Content $stderr
          if ($proc.ExitCode -ne 0) { throw "Build failed: $($proc.ExitCode)" }
      - name: Native overlay screenshot (no game connection)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $PWD 'artifacts/route-ui/native-overlay-result.txt'
          $image = Join-Path $PWD 'artifacts/route-ui/native-overlay.png'
          $proc = Start-Process 'build/staging/LocalNavigation.exe' -ArgumentList @('overlay-preview', "`"$result`"", "`"$image`"") -PassThru
          if (-not $proc.WaitForExit(15000)) { $proc.Kill(); throw 'Overlay preview timeout.' }
          if (-not (Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne 'OVERLAY_PREVIEW_OK') { throw 'Overlay preview failed.' }
          if (-not (Test-Path $image) -or (Get-Item $image).Length -lt 1000) { throw 'Overlay PNG missing.' }
      - name: Browser interaction and layout tests
        shell: pwsh
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed.' }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { $edge = 'C:\Program Files\Microsoft\Edge\Application\msedge.exe' }
          if (Test-Path $edge) {
            python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/route-ui
          } else {
            python -m playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed.' }
            python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/route-ui
          }
          if ($LASTEXITCODE -ne 0) { throw 'Route setup browser test failed.' }
      - name: Record tested sources and visual evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force docs/route-ui-evidence | Out-Null
          Copy-Item artifacts/route-ui/native-overlay.png docs/route-ui-evidence/
          Copy-Item artifacts/route-ui/routes-1366.png docs/route-ui-evidence/
          Copy-Item artifacts/route-ui/routes-390.png docs/route-ui-evidence/
          Copy-Item artifacts/route-ui/results.json docs/route-ui-evidence/
          $hash = (Get-FileHash dist/ai-miner-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            '# v9.1.9 Route UI validation',
            '',
            "Actions run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "Validated workflow head: $env:GITHUB_SHA",
            'Full Windows build, compiled EXE validate/smoke and existing regression suite: PASS.',
            'Actual C# overlay preview rendering without game access: PASS.',
            'Offline bundled UI interaction tests: 1366/820/600/390px PASS; see results.json.',
            'Three visible entries, per-mode commands, setup prerequisites and busy-state gates tested.',
            'Live FiveM walking, storage, refill and game-overlay compositing: NOT TESTED.',
            "Candidate executable SHA256: $hash"
          ) | Set-Content docs/ROUTE_SETUP_VALIDATION.md -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/mining-auto.ahk src/exe-route-navigation.ahk src/local-navigation/LocalNavigation.cs src/ui-host/Protocol.cs src/ui-host/Program.cs src/ui-web/src/app.js src/ui-web/src/app.css src/ui-web/src/index.html src/ui-web/test.mjs src/ui-web/package.json src/ui-web/package-lock.json src/ui-web/README.md src/ui-web/screenshots/README.md src/ui-web/www/app.js src/ui-web/www/app.css src/ui-web/www/index.html src/ui-web/www/build-info.json README.md src/README.md config/AI採掘機.ini docs/AI採掘機_使い方.txt docs/ROUTE_SETUP_VALIDATION.md docs/route-ui-evidence scripts/ui-tests/Test-RouteSetupBrowser.py
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged source check failed.' }
          git commit -m 'Complete tested route setup screen and recording overlay [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:fix/route-setup-overlay-9.1.9
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed; refusing overwrite.' }
          git archive --format=zip HEAD -o artifacts/route-ui/tested-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-ui-release-check-evidence
          path: |
            artifacts/route-ui/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 7
      - name: Retain candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route-setup-v9.1.9-candidate
          path: |
            dist/ai-miner-win-x64.exe
            docs/RELEASE_v9.1.9.md
            docs/ROUTE_SETUP_VALIDATION.md
          retention-days: 7
