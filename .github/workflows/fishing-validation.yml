name: Fishing validation
on:
  push:
    branches: [feat/auto-fishing-v9.2.0]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Archive only tracked source for integration tests
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fishing-source-snapshot
          path: source-snapshot.zip
          retention-days: 1
          if-no-files-found: error
