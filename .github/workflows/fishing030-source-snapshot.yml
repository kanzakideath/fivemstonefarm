name: Fishing 0.3 source snapshot
on:
  push:
    branches: [fix/fishing-timing-ui-0.3.0]
    paths: [.github/workflows/fishing030-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive the exact source
        run: |
          mkdir -p /tmp/fishing030
          git archive --format=zip -o /tmp/fishing030/source.zip HEAD
          git rev-parse HEAD > /tmp/fishing030/SOURCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fishing030-source-snapshot
          path: /tmp/fishing030/
          retention-days: 7
          if-no-files-found: error
