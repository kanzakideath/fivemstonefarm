name: Stationary recovery source review
on:
  push:
    branches: [fix/stationary-only-9.1.15]
    paths: [.github/workflows/stationary-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: git archive --format=zip -o stationary-review-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stationary-review-source
          path: stationary-review-source.zip
          retention-days: 7
