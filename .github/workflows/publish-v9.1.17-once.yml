name: Publish v9.1.17 direct fast washing
on:
  push:
    branches: [release/v9.1.17-publish]
    paths: [.github/workflows/publish-v9.1.17-once.yml]
permissions:
  contents: write
concurrency:
  group: ai-miner-publish-stable
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    steps:
      - name: Check out exact validated merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 234bb7ed766426eb11c3841e8d6fc3f504881110
          fetch-depth: 0
      - name: Verify source, successful PR checks and unchanged stable channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $expected='234bb7ed766426eb11c3841e8d6fc3f504881110'
          $tested='4ef932e69fb7e6249ee35c668dfc5a1fb3095d14'
          if((git rev-parse HEAD).Trim() -ne $expected){throw 'Unexpected source commit.'}
          git diff --quiet $tested HEAD
          if($LASTEXITCODE -ne 0){throw 'Merged files differ from tested PR source.'}
          foreach($runId in @('34702075224','34702075221')){
            $text=gh api "repos/$env:GH_REPO/actions/runs/$runId"
            if($LASTEXITCODE -ne 0){throw 'Cannot verify PR validation.'}
            $run=$text | ConvertFrom-Json
            if($run.head_sha -ne $tested -or $run.status -ne 'completed' -or $run.conclusion -ne 'success'){throw 'PR checks are not successful for the tested source.'}
          }
          $main=gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if($LASTEXITCODE -ne 0 -or $main.Trim() -ne $expected){throw 'Main changed.'}
          $latest=gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.16'){throw 'Stable release changed.'}
          $refs=gh api "repos/$env:GH_REPO/git/matching-refs/tags/v9.1.17"
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect tags.'}
          if(@($refs | ConvertFrom-Json | Where-Object {$_.ref -eq 'refs/tags/v9.1.17'}).Count){throw 'Never overwrite an existing release tag.'}
          if(-not(Test-Path docs/RELEASE_v9.1.17.md)){throw 'Release notes missing.'}
          New-Item -ItemType Directory -Force artifacts/direct-fast-release | Out-Null
          $expected | Set-Content artifacts/direct-fast-release/SOURCE.txt
      - name: Full build and signed update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_PKCS8_B64: ${{ secrets.UPDATE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          $ErrorActionPreference='Stop'
          Start-Transcript artifacts/direct-fast-release/build.txt
          try {
            ./scripts/Make-Release.ps1 -Version 9.1.17
            ./scripts/Verify-Release.ps1 -ArtifactDirectory artifacts/v9.1.17
          } finally {Stop-Transcript}
      - name: Verify actual old updater, fast-wash runtime and diagnostic ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/Test-UpdateApply.ps1 -ArtifactDirectory artifacts/v9.1.17 -OutputDirectory artifacts/direct-fast-release/actual-apply
          ./scripts/Test-FastWashContract.ps1
          ./scripts/Test-FastWashRuntime.ps1 -OutputDirectory artifacts/direct-fast-release/fast-runtime
          ./scripts/Test-StationaryWait.ps1 -OutputDirectory artifacts/direct-fast-release/wait
          ./scripts/Test-SupportExport.ps1 -OutputDirectory artifacts/direct-fast-release/diagnostic-export
      - name: Create exact new tag and upload draft assets only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $latest=gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.16'){throw 'Stable release changed before tagging.'}
          $main=gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if($LASTEXITCODE -ne 0 -or $main.Trim() -ne '234bb7ed766426eb11c3841e8d6fc3f504881110'){throw 'Main changed before tagging.'}
          git tag v9.1.17 234bb7ed766426eb11c3841e8d6fc3f504881110
          if($LASTEXITCODE -ne 0){throw 'Tag creation failed.'}
          git push origin refs/tags/v9.1.17
          if($LASTEXITCODE -ne 0){throw 'Tag push failed.'}
          $assets=@('ai-miner-win-x64.exe','AI-Miner-v9.1.17.zip','update-manifest.json','update-manifest.sig','SHA256SUMS.txt') | ForEach-Object {Join-Path $PWD "artifacts/v9.1.17/$_"}
          foreach($asset in $assets){if(-not(Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -le 0){throw 'Missing release asset.'}}
          gh release create v9.1.17 @assets --repo $env:GH_REPO --verify-tag --draft --title 'AI採掘機 v9.1.17' --notes-file docs/RELEASE_v9.1.17.md
          if($LASTEXITCODE -ne 0){throw 'Draft upload failed; do not publish.'}
      - name: Re-download and verify all bytes before publishing Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference='Stop'
          $download=Join-Path $PWD 'artifacts/downloaded-v9.1.17'
          New-Item -ItemType Directory $download | Out-Null
          gh release download v9.1.17 --repo $env:GH_REPO --dir $download
          if($LASTEXITCODE -ne 0){throw 'Could not re-download draft assets.'}
          ./scripts/Verify-Release.ps1 -ArtifactDirectory $download
          $files=@(Get-ChildItem -LiteralPath $download -File)
          if($files.Count -ne 5){throw 'Unexpected asset count.'}
          foreach($file in $files){
            $original=Join-Path $PWD "artifacts/v9.1.17/$($file.Name)"
            if(-not(Test-Path -LiteralPath $original) -or (Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $original).Hash){throw 'Uploaded bytes differ from tested release.'}
          }
          $latest=gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.16'){throw 'Another release appeared; leave draft.'}
          $main=gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if($LASTEXITCODE -ne 0 -or $main.Trim() -ne '234bb7ed766426eb11c3841e8d6fc3f504881110'){throw 'Main changed; leave draft.'}
          gh release edit v9.1.17 --repo $env:GH_REPO --draft=false --latest
          if($LASTEXITCODE -ne 0){throw 'Publication failed.'}
          $text=gh api "repos/$env:GH_REPO/releases/latest"
          if($LASTEXITCODE -ne 0){throw 'Cannot verify Latest.'}
          $release=$text | ConvertFrom-Json
          $expectedNames=@('AI-Miner-v9.1.17.zip','ai-miner-win-x64.exe','SHA256SUMS.txt','update-manifest.json','update-manifest.sig') | Sort-Object
          $actualNames=@($release.assets | ForEach-Object {$_.name}) | Sort-Object
          if($release.tag_name -ne 'v9.1.17' -or $release.draft -or $release.prerelease -or $release.assets.Count -ne 5 -or (Compare-Object $expectedNames $actualNames)){throw 'Published metadata mismatch.'}
          $text | Set-Content artifacts/direct-fast-release/published.json -Encoding utf8
      - name: Retain release and update evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v9.1.17-release-validation
          path: |
            artifacts/direct-fast-release/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Retain exact published files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: v9.1.17-published-assets
          path: artifacts/downloaded-v9.1.17/
          retention-days: 14
          if-no-files-found: error
