name: Validate nearby micro drift
on:
  push:
    branches: [fix/wash-micro-drift-9.1.13]
    paths: [.github/workflows/wash-micro-repair.yml]
permissions:
  contents: write
concurrency:
  group: wash-micro-repair-9.1.13
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply bounded micro-drift and profile contract changes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor 102a4f947c7e35beb525feb3d9883fc9f35b44e1 HEAD
          if($LASTEXITCODE -ne 0){throw 'Source baseline changed.'}
          python scripts/Apply-WashMicroFix.py
          if($LASTEXITCODE -ne 0){throw 'Patch boundaries changed.'}
          python scripts/Refine-WashFractional.py
          if($LASTEXITCODE -ne 0){throw 'Precision boundaries changed.'}
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if($LASTEXITCODE -ne 0){throw 'Diff validation failed.'}
      - name: Full build including micro-displacement and detached updater tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/wash-micro | Out-Null
          Start-Transcript artifacts/wash-micro/build.txt
          try { ./scripts/Build.ps1 -Version 9.1.13 }
          catch { Get-ChildItem build/staging/*self-test*.txt -ErrorAction SilentlyContinue | ForEach-Object {Write-Host $_.Name; Get-Content $_.FullName}; throw }
          finally { Stop-Transcript }
      - name: Test real native input against single-screen-pixel repeated drift
        shell: pwsh
        run: ./scripts/Test-WashPositionDesktop.ps1 -OutputDirectory artifacts/wash-micro
      - name: Native overlay and four-viewport setup interactions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $result=Join-Path $PWD 'artifacts/wash-micro/native-overlay-result.txt'
          $image=Join-Path $PWD 'artifacts/wash-micro/native-overlay.png'
          $p=Start-Process -FilePath (Join-Path $PWD 'build/staging/LocalNavigation.exe') -ArgumentList @('overlay-preview',"`"$result`"","`"$image`"") -PassThru
          if(-not $p.WaitForExit(15000)){$p.Kill();throw 'Overlay timeout.'}
          if(-not(Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne 'OVERLAY_PREVIEW_OK'){throw 'Overlay failed.'}
          python -m pip install playwright==1.57.0
          if($LASTEXITCODE -ne 0){throw 'Playwright install failed.'}
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if(-not(Test-Path $edge)){$edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe'}
          if(Test-Path $edge){python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/wash-micro}
          else {python -m playwright install chromium; if($LASTEXITCODE -ne 0){throw 'Browser install failed.'}; python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/wash-micro}
          if($LASTEXITCODE -ne 0){throw 'UI interactions failed.'}
      - name: Retain only tested application changes and remove one-shot tooling
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item scripts/Apply-WashMicroFix.py,scripts/Refine-WashFractional.py,.github/workflows/wash-micro-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/mining-auto.ahk src/wash-position.ahk src/wash-position/WashPosition.cs src/exe-route-navigation.ahk scripts/ui-tests/WashPositionDesktopProbe.cs scripts/Test-WashPositionDesktop.ps1 scripts/Test-WashRecoveryContract.ps1 scripts/Test-FarmRecoverySafetyContract.ps1 README.md src/README.md 'docs/AI採掘機_使い方.txt' 'config/AI採掘機.ini' src/ui-web/package.json src/ui-web/package-lock.json src/ui-web/src/app.js docs/RELEASE_v9.1.13.md docs/VALIDATION_v9.1.13.md scripts/Apply-WashMicroFix.py scripts/Refine-WashFractional.py .github/workflows/wash-micro-repair.yml
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if($LASTEXITCODE -ne 0){throw 'Staged diff failed.'}
          git commit -m 'Measure small nearby wash drift before resuming and expose correction state'
          if($LASTEXITCODE -ne 0){throw 'Commit failed.'}
          git push origin HEAD:fix/wash-micro-drift-9.1.13
          if($LASTEXITCODE -ne 0){throw 'Branch changed; refusing force push.'}
          git rev-parse HEAD | Set-Content artifacts/wash-micro/SOURCE.txt
          git archive --format=zip -o artifacts/wash-micro/tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wash-micro-evidence
          path: |
            artifacts/wash-micro/
            artifacts/update-startup/
            build/staging/*.log
            build/staging/*.txt
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: wash-micro-9.1.13-candidate
          path: dist/ai-miner-win-x64.exe
          retention-days: 14
          if-no-files-found: error
