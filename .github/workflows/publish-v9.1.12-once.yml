name: Publish v9.1.12 nearby washing fix
on:
  push:
    branches: [release/v9.1.12-publish]
    paths: [.github/workflows/publish-v9.1.12-once.yml]
permissions:
  contents: write
concurrency:
  group: ai-miner-publish-stable
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    steps:
      - name: Check out the exact tested merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 102a4f947c7e35beb525feb3d9883fc9f35b44e1
          fetch-depth: 0
      - name: Verify source and unchanged stable channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '102a4f947c7e35beb525feb3d9883fc9f35b44e1'
          if ((& git rev-parse HEAD).Trim() -ne $expected) { throw 'Unexpected source commit.' }
          $main = gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -ne $expected) { throw 'Main changed; do not publish.' }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.11') { throw 'Stable release changed.' }
          $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/v9.1.12"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if (@($refs | ConvertFrom-Json | Where-Object { $_.ref -eq 'refs/tags/v9.1.12' }).Count -ne 0) { throw 'Never overwrite an existing tag.' }
          if (-not (Test-Path docs/RELEASE_v9.1.12.md)) { throw 'Release notes are missing.' }
          New-Item -ItemType Directory -Force artifacts/nearby-release | Out-Null
          $expected | Set-Content artifacts/nearby-release/SOURCE.txt
      - name: Build final EXE, run all regressions and sign update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_PKCS8_B64: ${{ secrets.UPDATE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript artifacts/nearby-release/build.txt
          try {
            ./scripts/Make-Release.ps1 -Version 9.1.12
            ./scripts/Verify-Release.ps1 -ArtifactDirectory artifacts/v9.1.12
          } finally { Stop-Transcript }
      - name: Verify existing released updater installs and restarts the signed new application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-UpdateApply.ps1 -ArtifactDirectory artifacts/v9.1.12 -OutputDirectory artifacts/nearby-release/actual-apply
          ./scripts/Test-WashPositionDesktop.ps1 -OutputDirectory artifacts/nearby-release/native-wash
      - name: Create exact new tag and upload draft assets only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.11') { throw 'Release changed before tagging.' }
          $main = gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or $main.Trim() -ne '102a4f947c7e35beb525feb3d9883fc9f35b44e1') { throw 'Main changed before tagging.' }
          git tag v9.1.12 102a4f947c7e35beb525feb3d9883fc9f35b44e1
          if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed.' }
          git push origin refs/tags/v9.1.12
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed.' }
          $assets = @('ai-miner-win-x64.exe','AI-Miner-v9.1.12.zip','update-manifest.json','update-manifest.sig','SHA256SUMS.txt') | ForEach-Object { Join-Path $PWD "artifacts/v9.1.12/$_" }
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -le 0) { throw 'Release asset missing.' }
          }
          gh release create v9.1.12 @assets --repo $env:GH_REPO --verify-tag --draft --title 'AI採掘機 v9.1.12' --notes-file docs/RELEASE_v9.1.12.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; leave unpublished.' }
      - name: Re-download and verify all uploaded bytes before publishing Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $PWD 'artifacts/downloaded-v9.1.12'
          New-Item -ItemType Directory $download | Out-Null
          gh release download v9.1.12 --repo $env:GH_REPO --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Could not re-download draft assets.' }
          ./scripts/Verify-Release.ps1 -ArtifactDirectory $download
          $files = @(Get-ChildItem -LiteralPath $download -File)
          if ($files.Count -ne 5) { throw 'Unexpected downloaded asset count.' }
          foreach ($file in $files) {
            $original = Join-Path $PWD "artifacts/v9.1.12/$($file.Name)"
            if (-not (Test-Path -LiteralPath $original) -or (Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $original).Hash) { throw 'Uploaded release bytes differ from verified build.' }
          }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.11') { throw 'A different release appeared; leave draft unpublished.' }
          gh release edit v9.1.12 --repo $env:GH_REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
          $text = gh api "repos/$env:GH_REPO/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify published Latest.' }
          $release = $text | ConvertFrom-Json
          $expectedNames = @('AI-Miner-v9.1.12.zip','ai-miner-win-x64.exe','SHA256SUMS.txt','update-manifest.json','update-manifest.sig') | Sort-Object
          $actualNames = @($release.assets | ForEach-Object { $_.name }) | Sort-Object
          if ($release.tag_name -ne 'v9.1.12' -or $release.draft -or $release.prerelease -or $release.assets.Count -ne 5 -or (Compare-Object $expectedNames $actualNames)) { throw 'Published metadata mismatch.' }
          $text | Set-Content artifacts/nearby-release/published.json -Encoding utf8
      - name: Retain release and actual update evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v9.1.12-release-validation
          path: |
            artifacts/nearby-release/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Retain exact published assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: v9.1.12-published-assets
          path: artifacts/downloaded-v9.1.12/
          retention-days: 14
          if-no-files-found: error
