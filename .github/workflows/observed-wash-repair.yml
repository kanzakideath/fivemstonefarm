name: Observed washing validation
on:
  push:
    branches: [fix/washing-observed-position]
    paths: [.github/workflows/observed-wash-repair.yml]
permissions:
  contents: write
concurrency:
  group: observed-washing-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply explicit integration on its known baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor dc2f4bfbfb23a6ff1d30731f576a7c0d9a7d3ede HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected baseline.' }
          if ((Get-FileHash src/wash-position/WashPosition.cs -Algorithm SHA256).Hash.ToLowerInvariant() -ne '451fcced7bdb9ac4097b4d48b8e5959f7856bf0147e4b8a470649e8afc1ff4cb') { throw 'Observed helper source differs from local audit.' }
          if ((Get-FileHash src/wash-position.ahk -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'eb076d5c83d2808b377087053b1175d576a7914e012bbaf915be8b19075bb483') { throw 'Observed wrapper source differs from local audit.' }
          if (-not ([IO.File]::ReadAllText('src/mining-auto.ahk').Contains('RunObservedWashHelper("wash-correct"'))) {
            foreach ($name in @('record','backend','ui','finalize')) {
              python "scripts/passive-route-repair/$name.py"
              if ($LASTEXITCODE -ne 0) { throw "Pending source boundary failed: $name" }
            }
            python scripts/Apply-ObservedWash.py
            if ($LASTEXITCODE -ne 0) { throw 'Observed integration failed.' }
            python scripts/Apply-ObservedWashUi.py
            if ($LASTEXITCODE -ne 0) { throw 'Observed UI integration failed.' }
          }
          node --check src/ui-web/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid UI JavaScript.' }
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid source whitespace.' }
      - name: Full Windows build and compiled regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/observed-wash | Out-Null
          Start-Transcript artifacts/observed-wash/windows-validation.txt
          try { ./scripts/Build.ps1 -Version 9.1.10 } finally { Stop-Transcript }
      - name: Native overlay and four-viewport route interactions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Join-Path $PWD 'artifacts/observed-wash/native-overlay-result.txt'
          $image = Join-Path $PWD 'artifacts/observed-wash/native-overlay.png'
          $proc = Start-Process -FilePath (Join-Path $PWD 'build/staging/LocalNavigation.exe') -ArgumentList @('overlay-preview', "`"$result`"", "`"$image`"") -PassThru
          if (-not $proc.WaitForExit(15000)) { $proc.Kill(); throw 'Overlay timeout.' }
          if (-not (Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne 'OVERLAY_PREVIEW_OK') { throw 'Overlay failure.' }
          python -m pip install playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency install failed.' }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { $edge = 'C:\Program Files\Microsoft\Edge\Application\msedge.exe' }
          if (Test-Path $edge) {
            python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/observed-wash
          } else {
            python -m playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Browser install failed.' }
            python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/observed-wash
          }
          if ($LASTEXITCODE -ne 0) { throw 'Browser interaction tests failed.' }
      - name: Commit tested runtime sources and remove one-shot patchers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          Remove-Item scripts/passive-route-repair -Recurse -Force
          Remove-Item scripts/Apply-ObservedWash.py,scripts/Apply-ObservedWashUi.py -Force
          Remove-Item .github/workflows/passive-route-repair.yml,.github/workflows/wash-source-export.yml,.github/workflows/observed-wash-repair.yml -Force
          git add -u
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged source diff failed.' }
          git commit -m 'Use observed foreground wash correction and retain tested nearby storage and passive routes [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit validated changes.' }
          git push origin HEAD:fix/washing-observed-position
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed; do not overwrite.' }
          $head = (& git rev-parse HEAD).Trim()
          $hash = (Get-FileHash dist/ai-miner-win-x64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "source_commit=$head`nsha256=$hash`nCompiled and synthetic/UI tests only. Live FiveM movement, washing speed and storage are NOT verified." | Set-Content artifacts/observed-wash/CANDIDATE.txt -Encoding utf8
          git archive --format=zip HEAD -o artifacts/observed-wash/tested-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-washing-evidence
          path: |
            artifacts/observed-wash/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Retain tested executable
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observed-washing-9.1.10-candidate
          path: |
            dist/ai-miner-win-x64.exe
            docs/RELEASE_v9.1.10.md
            artifacts/observed-wash/CANDIDATE.txt
          retention-days: 14
          if-no-files-found: error
