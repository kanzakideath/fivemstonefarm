name: Prepare offline completion voices
on:
  push:
    branches: [fix/exe-only-routes-and-voices]
    paths: [.github/workflows/prepare-offline-voices.yml]
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download pinned official synthesis engine for build-time use only
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/voicevox.7z.001 https://github.com/VOICEVOX/voicevox_engine/releases/download/0.25.2/voicevox_engine-linux-cpu-x64-0.25.2.7z.001
          echo 'bab016a966131b89bad398e7b898f8c742617dc80a7da49bf494cd07133dbc7a  /tmp/voicevox.7z.001' | sha256sum -c -
          7z x /tmp/voicevox.7z.001 -o/tmp/voicevox >/dev/null
          engine=$(find /tmp/voicevox -type f -name run -print -quit)
          test -n "$engine"
          chmod +x "$engine"
          "$engine" --host 127.0.0.1 --port 50021 --cpu_num_threads 2 >/tmp/voicevox.log 2>&1 &
          echo $! >/tmp/voicevox.pid
          for n in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:50021/version; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/voicevox.log
          exit 1
      - name: Synthesize exact completion phrases and record provenance
        shell: python
        run: |
          import hashlib, io, json, pathlib, urllib.parse, urllib.request, wave
          root = pathlib.Path('src/audio'); root.mkdir(parents=True, exist_ok=True)
          def req(path, payload=None):
              request = urllib.request.Request('http://127.0.0.1:50021/'+path, data=payload if payload is not None else b'', headers={'Content-Type':'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=120) as r: return r.read()
          speakers = json.load(urllib.request.urlopen('http://127.0.0.1:50021/speakers'))
          speaker = next(s for s in speakers if s['name']=='四国めたん')
          phrases = {'mining-complete':'石掘りが終わったよ。', 'washing-complete':'石洗いが終わったよ。', 'gold-complete':'砂金取りが終わりました。'}
          records=[]
          for variant, style in [('sweet','あまあま'),('clear','ノーマル')]:
              sid=next(s['id'] for s in speaker['styles'] if s['name']==style and s.get('type','talk')=='talk')
              for name,text in phrases.items():
                  query=json.loads(req('audio_query?'+urllib.parse.urlencode({'text':text,'speaker':sid})))
                  query.update(speedScale=1.04, pitchScale=0.025 if variant=='sweet' else 0.0, intonationScale=1.1, volumeScale=0.85, prePhonemeLength=0.08, postPhonemeLength=0.18, outputSamplingRate=24000, outputStereo=False)
                  wav=req('synthesis?'+urllib.parse.urlencode({'speaker':sid}),json.dumps(query).encode())
                  with wave.open(io.BytesIO(wav)) as w:
                      duration=w.getnframes()/w.getframerate()
                      if not 0.4 < duration < 12 or w.getnchannels()!=1 or w.getsampwidth()!=2: raise RuntimeError('Unexpected audio format')
                  filename=f'{name}-{variant}.wav'; (root/filename).write_bytes(wav)
                  records.append({'file':filename,'text':text,'voice':'VOICEVOX:四国めたん','style':style,'speakerId':sid,'engineVersion':'0.25.2','durationSeconds':duration,'sha256':hashlib.sha256(wav).hexdigest()})
          (root/'voice-manifest.json').write_text(json.dumps({'schema':1,'credit':'VOICEVOX:四国めたん','generation':'Build-time synthesis; runtime playback is offline. No voice model or engine redistributed.','terms':['https://voicevox.hiroshiba.jp/term/','https://zunko.jp/con_ongen_kiyaku.html'],'clips':records},ensure_ascii=False,indent=2)+'\n',encoding='utf8')
          (root/'CREDITS.txt').write_text('音声：VOICEVOX:四国めたん（あまあま／ノーマル）\n生成音声の利用・再配布には以下の利用規約を遵守してください。再利用を他者に許諾する場合も同じ遵守義務を引き継いでください。\nhttps://voicevox.hiroshiba.jp/term/\nhttps://zunko.jp/con_ongen_kiyaku.html\n音声モデル・音声合成エンジンそのものは同梱していません。\n',encoding='utf8')
      - name: Commit only generated audio and attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/audio
          git diff --cached --check
          git commit -m 'Add credited offline completion voices for mining washing and gold [skip ci]'
          git push origin HEAD:fix/exe-only-routes-and-voices
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-completion-voices
          path: src/audio/
          retention-days: 7
          if-no-files-found: error
      - name: Stop temporary synthesis engine
        if: always()
        run: |
          if test -f /tmp/voicevox.pid; then kill "$(cat /tmp/voicevox.pid)" || true; fi
