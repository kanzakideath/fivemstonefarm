name: Update startup diagnosis
on:
  push:
    branches: [fix/update-validation-9.1.11]
    paths: [.github/workflows/update-startup-diagnosis.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce using the exact published executable, without touching user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/update-startup | Out-Null
          $exe = Join-Path $env:RUNNER_TEMP 'published-v9.1.10.exe'
          Invoke-WebRequest 'https://github.com/kanzakideath/fivemstonefarm/releases/download/v9.1.10/ai-miner-win-x64.exe' -OutFile $exe
          if ((Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant() -ne 'cbbe82396409e10e1dc8df50171a133bcc7a151eac78f0a44ef35fca220e074d') { throw 'Published EXE hash mismatch.' }
          ./scripts/Test-UpdateStartup.ps1 -ExecutablePath $exe -ObserveOnly
          Get-Content artifacts/update-startup/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: update-startup-baseline
          path: artifacts/update-startup/
          retention-days: 14
          if-no-files-found: error
