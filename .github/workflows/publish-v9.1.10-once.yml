name: Publish v9.1.10 verified update
on:
  push:
    branches: [release/v9.1.10-publish]
    paths: [.github/workflows/publish-v9.1.10-once.yml]
permissions:
  contents: write
concurrency:
  group: publish-v9.1.10-verified
  cancel-in-progress: false
jobs:
  publish:
    name: Build, test native input, sign and verify publication
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release
    steps:
      - name: Check out exact merged release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8ed65c3ace8144706ca854704448a64404851814
          fetch-depth: 0
      - name: Validate exact source and publication preconditions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '8ed65c3ace8144706ca854704448a64404851814'
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $expected) { throw 'Unexpected source commit.' }
          $remoteMain = gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or $remoteMain.Trim() -ne $expected) { throw 'Main changed; do not publish stale source.' }
          if ([IO.File]::ReadAllText('src/mining-auto.ahk') -notmatch '(?m)^global AppVersion := "9\.1\.10"') { throw 'Version mismatch.' }
          foreach ($file in @('src/wash-position/WashPosition.cs','src/wash-position.ahk','scripts/Test-WashPositionDesktop.ps1','docs/RELEASE_v9.1.10.md')) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Required source missing: $file" }
          }
          if (-not ([IO.File]::ReadAllText('src/mining-auto.ahk').Contains('RunObservedWashHelper("wash-correct"'))) { throw 'Observed washing is not wired to the actual Farm path.' }
          if (-not ([IO.File]::ReadAllText('src/ui-web/src/index.html').Contains('id="route-wash-position"'))) { throw 'Input feedback UI missing.' }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.9') { throw 'Latest release changed; do not supersede another publication.' }
          $refs = gh api "repos/$env:GH_REPO/git/matching-refs/tags/v9.1.10"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing tag.' }
          if (@($refs | ConvertFrom-Json | Where-Object { $_.ref -eq 'refs/tags/v9.1.10' }).Count -ne 0) { throw 'Tag already exists; never overwrite.' }
          New-Item -ItemType Directory -Force artifacts/release-evidence | Out-Null
          "source_commit=$head`nNative input uses a synthetic Windows target. Live FiveM speed, washing and transfers are NOT verified." | Set-Content artifacts/release-evidence/SOURCE.txt -Encoding utf8
      - name: Full build, executable tests and signed release package
        shell: pwsh
        timeout-minutes: 16
        env:
          UPDATE_SIGNING_KEY_PKCS8_B64: ${{ secrets.UPDATE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript artifacts/release-evidence/build.txt
          try {
            ./scripts/Make-Release.ps1 -Version 9.1.10
            ./scripts/Verify-Release.ps1 -ArtifactDirectory artifacts/v9.1.10
          } finally { Stop-Transcript }
      - name: Verify the production helper native input path before publishing
        shell: pwsh
        run: ./scripts/Test-WashPositionDesktop.ps1 -OutputDirectory artifacts/release-evidence
      - name: Create new exact tag and upload draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '8ed65c3ace8144706ca854704448a64404851814'
          $remoteMain = gh api "repos/$env:GH_REPO/branches/main" --jq '.commit.sha'
          if ($LASTEXITCODE -ne 0 -or $remoteMain.Trim() -ne $expected) { throw 'Main changed during build.' }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.9') { throw 'Another release appeared.' }
          git tag v9.1.10 $expected
          if ($LASTEXITCODE -ne 0) { throw 'New tag creation failed.' }
          git push origin refs/tags/v9.1.10
          if ($LASTEXITCODE -ne 0) { throw 'Tag push failed; never force.' }
          $assets = @('ai-miner-win-x64.exe','AI-Miner-v9.1.10.zip','update-manifest.json','update-manifest.sig','SHA256SUMS.txt') | ForEach-Object { Join-Path $PWD "artifacts/v9.1.10/$_" }
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf) -or (Get-Item -LiteralPath $asset).Length -le 0) { throw "Missing asset: $asset" }
          }
          gh release create v9.1.10 @assets --repo $env:GH_REPO --verify-tag --draft --title 'AI採掘機 v9.1.10' --notes-file docs/RELEASE_v9.1.10.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed; do not publish.' }
      - name: Re-download, verify signature and hashes, then publish Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $PWD 'artifacts/downloaded-v9.1.10'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download v9.1.10 --repo $env:GH_REPO --dir $download
          if ($LASTEXITCODE -ne 0) { throw 'Re-download failed.' }
          ./scripts/Verify-Release.ps1 -ArtifactDirectory $download
          $files = @(Get-ChildItem -LiteralPath $download -File)
          if ($files.Count -ne 5) { throw 'Unexpected asset count.' }
          foreach ($asset in $files) {
            $original = Join-Path $PWD "artifacts/v9.1.10/$($asset.Name)"
            if (-not (Test-Path -LiteralPath $original) -or (Get-FileHash -LiteralPath $asset.FullName).Hash -ne (Get-FileHash -LiteralPath $original).Hash) { throw 'Uploaded bytes differ from verified build.' }
          }
          $latest = gh api "repos/$env:GH_REPO/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne 'v9.1.9') { throw 'Latest changed; leave draft unpublished.' }
          gh release edit v9.1.10 --repo $env:GH_REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
          $publishedText = gh api "repos/$env:GH_REPO/releases/latest"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify Latest endpoint.' }
          $published = $publishedText | ConvertFrom-Json
          if ($published.tag_name -ne 'v9.1.10' -or $published.draft -or $published.prerelease -or $published.assets.Count -ne 5) { throw 'Published metadata mismatch.' }
          $publishedText | Set-Content artifacts/release-evidence/published.json -Encoding utf8
          Write-Host 'PUBLISHED v9.1.10: ECDSA update signature, uploaded bytes, package and SHA-256 re-verified.'
      - name: Retain build and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9.1.10-release-validation
          path: |
            artifacts/release-evidence/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: Retain exact published assets
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9.1.10-published-assets
          path: artifacts/downloaded-v9.1.10/
          retention-days: 14
          if-no-files-found: error
