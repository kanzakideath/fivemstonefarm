name: Validate stationary wait and resume
on:
  push:
    branches: [fix/stationary-only-9.1.15]
    paths: [.github/workflows/stationary-wait-repair.yml, scripts/Apply-StationaryWait.py]
permissions:
  contents: write
concurrency:
  group: stationary-wait-9.1.15
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply complete hash-checked delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor bee9d8b81289ed182a27220638632b57e8fd7a0e HEAD
          if($LASTEXITCODE -ne 0){throw 'Baseline changed.'}
          New-Item -ItemType Directory -Force artifacts/stationary-wait | Out-Null
          python scripts/Apply-StationaryWait.py
          if($LASTEXITCODE -ne 0){throw 'Source delta did not verify.'}
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if($LASTEXITCODE -ne 0){throw 'Diff failed.'}
      - name: Full build, production wait loop and update compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Transcript artifacts/stationary-wait/build.txt
          try { ./scripts/Build.ps1 -Version 9.1.15 } finally {Stop-Transcript}
      - name: Diagnostic export and stationary settings at four viewport sizes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/Test-SupportExport.ps1 -OutputDirectory artifacts/stationary-wait/export
          python -m pip install playwright==1.57.0
          if($LASTEXITCODE -ne 0){throw 'Browser tooling failed.'}
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if(-not(Test-Path $edge)){$edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe'}
          if(Test-Path $edge){python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/stationary-wait/ui}
          else {python -m playwright install chromium; if($LASTEXITCODE -ne 0){throw 'Browser install failed.'}; python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/stationary-wait/ui}
          if($LASTEXITCODE -ne 0){throw 'Stationary UI failed.'}
      - name: Retain tested source and remove temporary tooling
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temporary=@('scripts/Apply-StationaryWait.py','scripts/stationary-patch-1.b64','scripts/stationary-patch-2.b64','.github/workflows/stationary-review-source.yml','.github/workflows/stationary-wait-repair.yml')
          $temporary += 0..6 | ForEach-Object {"scripts/stationary-wait-$_.b64"}
          foreach($file in $temporary){if(Test-Path -LiteralPath $file){Remove-Item -LiteralPath $file}}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add -- src/stationary-only.ahk scripts/Test-StationaryWait.ps1 scripts/ui-tests/StationaryWaitHarness.ahk docs/RELEASE_v9.1.15.md docs/VALIDATION_v9.1.15.md
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if($LASTEXITCODE -ne 0){throw 'Staged diff failed.'}
          git commit -m 'Use stationary-only work with cancellable observation waits and automatic resume'
          if($LASTEXITCODE -ne 0){throw 'Commit failed.'}
          git push origin HEAD:fix/stationary-only-9.1.15
          if($LASTEXITCODE -ne 0){throw 'Branch changed; not force pushing.'}
          git rev-parse HEAD | Set-Content artifacts/stationary-wait/SOURCE.txt
          git archive --format=zip -o artifacts/stationary-wait/tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stationary-wait-evidence
          path: |
            artifacts/stationary-wait/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
            scripts/stationary-wait-*.b64
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: stationary-wait-candidate
          path: dist/ai-miner-win-x64.exe
          retention-days: 14
          if-no-files-found: error
