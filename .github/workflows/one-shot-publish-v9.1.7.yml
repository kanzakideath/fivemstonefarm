name: One-shot publish v9.1.7

on:
  push:
    branches:
      - release/v9.1.7-tag-helper
    paths:
      - .github/workflows/one-shot-publish-v9.1.7.yml

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish v9.1.7
    runs-on: windows-latest
    timeout-minutes: 25
    environment: release

    steps:
      - name: Check out validated v9.1.7 tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v9.1.7

      - name: Verify release tag target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '83e3a904c9c54ab9af59f567eefa46ae1d39c49e'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -cne $expected) {
            throw "v9.1.7 points to unexpected commit: $actual"
          }
          if ((Get-Content -LiteralPath 'src\mining-auto.ahk' -Raw -Encoding UTF8) -notmatch 'global AppVersion := "9\.1\.7"') {
            throw 'Tagged source does not declare AppVersion 9.1.7.'
          }

      - name: Download and verify pinned build tools
        shell: pwsh
        run: .\scripts\Bootstrap-Tools.ps1

      - name: Build, smoke-test, sign, and verify assets
        timeout-minutes: 18
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY_PKCS8_B64: ${{ secrets.UPDATE_SIGNING_KEY_PKCS8_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishedAt = (git show -s --format=%cI HEAD).Trim()
          $publishedAtUtc = [DateTimeOffset]::Parse($publishedAt).UtcDateTime.ToString('yyyy-MM-ddTHH:mm:ssZ')
          .\scripts\Make-Release.ps1 -Version 9.1.7 -PublishedAt $publishedAtUtc

      - name: Publish GitHub Release and mark latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v9.1.7'
          $artifactRoot = Join-Path $PWD 'artifacts\v9.1.7'
          $assets = @(
            (Join-Path $artifactRoot 'ai-miner-win-x64.exe'),
            (Join-Path $artifactRoot 'AI-Miner-v9.1.7.zip'),
            (Join-Path $artifactRoot 'update-manifest.json'),
            (Join-Path $artifactRoot 'update-manifest.sig'),
            (Join-Path $artifactRoot 'SHA256SUMS.txt')
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "$tag release already exists; refusing to overwrite it."
          }
          gh release create $tag @assets --repo $env:GH_REPO --verify-tag --title 'AI採掘機 v9.1.7' --generate-notes --draft
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
          gh release edit $tag --repo $env:GH_REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release publish failed: $LASTEXITCODE" }
