name: Validate v9.1.17 direct fast washing
on:
  push:
    branches: [fix/fast-wash-direct-9.1.17]
    paths: [.github/workflows/direct-fast-wash-repair.yml]
permissions:
  contents: write
concurrency:
  group: direct-fast-wash-9.1.17
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Materialize and verify reviewed source patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/fast-wash-17 | Out-Null
          @'
          from pathlib import Path
          import base64, zlib, hashlib
          encoded = ''.join(Path(f'scripts/patch17.{i}.b64').read_text().strip() for i in range(3))
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected = 'b2dc03ebb889c2d929d343de491406766fa1d6ce7c430c03c694ac23c9da16a3'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise RuntimeError('Reviewed source patch hash mismatch')
          Path('artifacts/fast-wash-17/reviewed.patch').write_bytes(patch)
          print('Reviewed patch SHA-256:', expected)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'Patch decoding failed.'}
          git apply --check artifacts/fast-wash-17/reviewed.patch
          if($LASTEXITCODE -ne 0){throw 'Patch does not match checked-out source.'}
          git apply artifacts/fast-wash-17/reviewed.patch
          if($LASTEXITCODE -ne 0){throw 'Patch application failed.'}
          python scripts/Finalize-DirectFast17.py
          if($LASTEXITCODE -ne 0){throw 'Final click repair failed.'}
          python scripts/Patch-FastWashStartContract.py
          if($LASTEXITCODE -ne 0){throw 'Start contract update failed.'}
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if($LASTEXITCODE -ne 0){throw 'Source whitespace check failed.'}
          ./scripts/Test-FastWashContract.ps1
      - name: Full Windows build and production helper regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Transcript artifacts/fast-wash-17/build.txt
          try { ./scripts/Build.ps1 -Version 9.1.17 } finally { Stop-Transcript }
          ./scripts/Test-FastWashRuntime.ps1 -OutputDirectory artifacts/fast-wash-17/runtime
          ./scripts/Test-FastWashContract.ps1
      - name: Verify quick-start UI at four widths and diagnostic export
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/Test-SupportExport.ps1 -OutputDirectory artifacts/fast-wash-17/diagnostics
          python -m pip install playwright==1.57.0
          if($LASTEXITCODE -ne 0){throw 'Playwright installation failed.'}
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if(-not(Test-Path $edge)){$edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe'}
          if(Test-Path $edge){python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/fast-wash-17/ui}
          else {python -m playwright install chromium; if($LASTEXITCODE -ne 0){throw 'Browser installation failed.'}; python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/fast-wash-17/ui}
          if($LASTEXITCODE -ne 0){throw 'Browser quick-start regression failed.'}
      - name: Retain only validated readable source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item scripts/patch17.0.b64,scripts/patch17.1.b64,scripts/patch17.2.b64,scripts/patch17-finalclick.b64,scripts/Finalize-DirectFast17.py,scripts/Patch-FastWashStartContract.py,.github/workflows/direct-fast-wash-repair.yml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md 'config/AI採掘機.ini' 'docs/AI採掘機_使い方.txt' docs/RELEASE_v9.1.17.md scripts/Build.ps1 scripts/Test-FastWashContract.ps1 scripts/Test-FastWashRuntime.ps1 scripts/Test-StorageClosedLoopContract.ps1 scripts/Test-StoneProgressContract.ps1 scripts/ui-tests/FastWashHarness.ahk scripts/ui-tests/Test-RouteSetupBrowser.py src/README.md src/fast-wash.ahk src/mining-auto.ahk src/ui-host/Protocol.cs src/ui-web/package.json src/ui-web/package-lock.json src/ui-web/src/app.css src/ui-web/src/app.js src/ui-web/src/index.html src/ui-web/test.mjs src/background-bridge/CdpBridge.cs scripts/Test-WashDomExpressions.ps1 scripts/Test-WashDomExpressions.mjs
          git add -u -- scripts/patch17.0.b64 scripts/patch17.1.b64 scripts/patch17.2.b64 scripts/patch17-finalclick.b64 scripts/Finalize-DirectFast17.py scripts/Patch-FastWashStartContract.py .github/workflows/direct-fast-wash-repair.yml
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if($LASTEXITCODE -ne 0){throw 'Staged diff failed.'}
          git commit -m 'Fix fast-wash native actions, direct start, final click policy and inventory scheduling'
          if($LASTEXITCODE -ne 0){throw 'Source commit failed.'}
          git push origin HEAD:fix/fast-wash-direct-9.1.17
          if($LASTEXITCODE -ne 0){throw 'Source push failed.'}
          git rev-parse HEAD | Set-Content artifacts/fast-wash-17/SOURCE.txt
          git archive --format=zip -o artifacts/fast-wash-17/tested-source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-wash-17-evidence
          path: |
            artifacts/fast-wash-17/
            artifacts/fast-wash-runtime/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: fast-wash-v9.1.17-candidate
          path: dist/ai-miner-win-x64.exe
          retention-days: 14
          if-no-files-found: error
