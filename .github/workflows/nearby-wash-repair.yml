name: Verify nearby washing continuation
on:
  push:
    branches: [fix/nearby-wash-functional-ready]
    paths: [.github/workflows/nearby-wash-repair.yml]
permissions:
  contents: write
concurrency:
  group: nearby-wash-repair
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply reviewed narrow changes to the exact baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git merge-base --is-ancestor a4aac73eb97b8f4d54fc7dd2d36576654eb3f483 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected baseline.' }
          python scripts/Apply-NearbyWashFix.py
          if ($LASTEXITCODE -ne 0) { throw 'Source boundaries or output hashes changed.' }
          node --check src/ui-web/src/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Invalid UI JavaScript.' }
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Source whitespace check failed.' }
          git diff --exit-code a4aac73eb97b8f4d54fc7dd2d36576654eb3f483 -- src/wash-position/WashPosition.cs src/updater/Updater.cs
          if ($LASTEXITCODE -ne 0) { throw 'Existing native correction or updater changed.' }
      - name: Full build including compiled decision, real DOM and detached updater tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/nearby-wash | Out-Null
          Start-Transcript artifacts/nearby-wash/windows-validation.txt
          try { ./scripts/Build.ps1 -Version 9.1.12 } finally { Stop-Transcript }
      - name: Retain native correction and visible setup regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/Test-WashPositionDesktop.ps1 -OutputDirectory artifacts/nearby-wash
          $result = Join-Path $PWD 'artifacts/nearby-wash/native-overlay-result.txt'
          $image = Join-Path $PWD 'artifacts/nearby-wash/native-overlay.png'
          $proc = Start-Process -FilePath (Join-Path $PWD 'build/staging/LocalNavigation.exe') -ArgumentList @('overlay-preview', "`"$result`"", "`"$image`"") -PassThru
          if (-not $proc.WaitForExit(15000)) { $proc.Kill(); throw 'Overlay preview timeout.' }
          if (-not (Test-Path $result) -or (Get-Content $result -Raw).Trim() -ne 'OVERLAY_PREVIEW_OK') { throw 'Overlay preview failed.' }
          python -m pip install playwright==1.57.0
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependency install failed.' }
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { $edge = 'C:\Program Files\Microsoft\Edge\Application\msedge.exe' }
          if (Test-Path $edge) {
            python scripts/ui-tests/Test-RouteSetupBrowser.py --browser $edge --output artifacts/nearby-wash
          } else {
            python -m playwright install chromium
            if ($LASTEXITCODE -ne 0) { throw 'Browser install failed.' }
            python scripts/ui-tests/Test-RouteSetupBrowser.py --output artifacts/nearby-wash
          }
          if ($LASTEXITCODE -ne 0) { throw 'Browser interaction test failed.' }
      - name: Retain tested runtime source and remove temporary patch tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/Apply-NearbyWashFix.py .github/workflows/nearby-source-export.yml .github/workflows/nearby-wash-repair.yml
          if ($LASTEXITCODE -ne 0) { throw 'Temporary tooling cleanup failed.' }
          git add -- src/mining-auto.ahk src/wash-position.ahk src/nearby-wash.ahk src/exe-route-navigation.ahk src/background-bridge/CdpBridge.cs scripts/Build.ps1 scripts/Test-WashDomExpressions.ps1 scripts/Test-WashDomExpressions.mjs src/ui-web/src/index.html src/ui-web/src/app.js src/ui-web/package.json src/ui-web/package-lock.json README.md src/README.md 'docs/AI採掘機_使い方.txt' 'config/AI採掘機.ini' docs/RELEASE_v9.1.12.md docs/VALIDATION_v9.1.12.md
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'Staged source diff failed.' }
          git commit -m 'Continue verified nearby washing after non-convergent image checks [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit tested source.' }
          git push origin HEAD:fix/nearby-wash-functional-ready
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed; do not force push.' }
          $head = (& git rev-parse HEAD).Trim()
          "source=$head`nReal FiveM gameplay NOT verified." | Set-Content artifacts/nearby-wash/SOURCE.txt
          git archive --format=zip HEAD -o artifacts/nearby-wash/tested-source.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nearby-wash-evidence
          path: |
            artifacts/nearby-wash/
            artifacts/update-startup/
            build/staging/*.txt
            build/staging/*.log
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: nearby-wash-9.1.12-candidate
          path: dist/ai-miner-win-x64.exe
          retention-days: 14
          if-no-files-found: error
