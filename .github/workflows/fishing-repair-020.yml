name: FishingPilot 0.2.0 repair validation
on:
  push:
    branches: [fix/fishing-recast-background-0.2.0]
    paths: [.github/workflows/fishing-repair-020.yml, portable/ApplyRepair.py, portable/FinalPolish.py]
permissions:
  contents: read
concurrency:
  group: fishing-pilot-020
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Recreate pinned baseline and verify repair bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force artifacts/fishing020 | Out-Null
          python portable/Prepare.py
          if($LASTEXITCODE -ne 0){throw 'Baseline preparation failed.'}
          python portable/ApplyRepair.py
          if($LASTEXITCODE -ne 0){throw 'Repair verification failed.'}
          python portable/FinalPolish.py
          if($LASTEXITCODE -ne 0){throw 'Final source boundaries changed.'}
      - name: Compile complete executable and run regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Start-Transcript artifacts/fishing020/build.txt
          try { ./portable/Build.ps1 -Test } finally { Stop-Transcript }
      - name: Validate background target isolation and dynamic ring geometry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install playwright==1.57.0
          if($LASTEXITCODE -ne 0){throw 'Browser test tool install failed.'}
          $edge='C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if(!(Test-Path $edge)){$edge='C:\Program Files\Microsoft\Edge\Application\msedge.exe'}
          if(!(Test-Path $edge)){throw 'Test browser unavailable.'}
          python portable/TestScene.py --browser $edge --output artifacts/fishing020/browser
          if($LASTEXITCODE -ne 0){throw 'Targeted background and geometry tests failed.'}
      - name: Package tested executable and readable source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $PWD 'artifacts/download'
          New-Item -ItemType Directory -Force $output | Out-Null
          Compress-Archive -Path portable/dist/* -DestinationPath "$output/FishingPilot-0.2.0-preview-win-x64.zip"
          $src=Join-Path $PWD 'artifacts/clean-source'
          New-Item -ItemType Directory -Force $src | Out-Null
          Copy-Item portable/*.cs,portable/SceneProbe.js,portable/TestScene.py,portable/Build.ps1,portable/digit-templates.json,portable/README.txt,portable/LICENSE $src
          Copy-Item portable/fixtures $src -Recurse
          Compress-Archive -Path "$src/*" -DestinationPath "$output/FishingPilot-0.2.0-preview-source.zip"
          Get-ChildItem $output -File | ForEach-Object {('{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),$_.Name)} | Set-Content "$output/SHA256SUMS.txt"
          git rev-parse HEAD | Set-Content artifacts/fishing020/TRANSPORT-COMMIT.txt
      - name: Preserve validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fishing020-evidence
          path: |
            artifacts/fishing020/
            portable/dist/test-evidence/
          retention-days: 14
      - name: Downloadable tested repair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: fishing020-download
          path: artifacts/download/
          retention-days: 14
          if-no-files-found: error
