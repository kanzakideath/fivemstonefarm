name: Nearby washing source snapshot
on:
  push:
    branches: [fix/nearby-wash-functional-ready]
    paths: [.github/workflows/nearby-source-export.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a4aac73eb97b8f4d54fc7dd2d36576654eb3f483
          persist-credentials: false
      - run: git archive --format=zip HEAD -o "$RUNNER_TEMP/nearby-baseline.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nearby-baseline-source
          path: ${{ runner.temp }}/nearby-baseline.zip
          retention-days: 7
          if-no-files-found: error
