name: Export washing audit source
on:
  push:
    branches: [fix/washing-observed-position]
    paths: [.github/workflows/wash-source-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD -o washing-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: washing-source
          path: washing-source.zip
          retention-days: 7
