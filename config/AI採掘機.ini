; AI採掘機 v7.0.0 設定テンプレート
; ActionMode: mining（採掘）/ washing（石洗い）/ gold（砂金採り）
[General]
ActionMode=mining
BackgroundMode=1
HideWhileRunning=1

[Controls]
StartHotkey=F8
StopHotkey=F9

; 更新先はアプリ内に固定されています。URLを設定する必要はありません。
[Updates]
Schema=1
AutoCheck=1

[Washing]
CycleMs=9000
ForwardCorrection=1
ForwardPulseMs=100
ForwardSettleMs=250

[GoldPanning]
CycleMs=6000
RecoveryEnabled=1
RecoveryAfterMs=12000
RecoveryPulseMs=150
RecoverySettleMs=300

; 車両はサーバー管理者が導入した ai_miner_companion を通じて登録します。
; 所有権をサーバー側で確認し、登録車両の現在位置を毎回解決します。
; ID・StorageId・StorageTypeはアプリが検証して保存するため、手編集しないでください。
[VehicleStorage]
Enabled=0
Registered=0
DisplayName=登録車両
StorageId=
StorageType=
WorkMode=mining
; RouteFormat=4 / CompanionProtocol=1 が動的車両登録の現行形式です。
; 旧座標・キー記録ルートは安全のため再生しません。
RouteFormat=0
CompanionProtocol=0
CompanionRegistrationId=
; 次の2項目は旧版設定の安全な移行用です。v7では車両移動に使用しません。
OutboundRoute=
ReturnRoute=
CapacityCheckIntervalMs=3000
; 残り重量がこの値以下になると収納を開始します（250～20000g）。
; サーバーのweight/maxWeightを主条件とし、全スロット使用は補助条件です。
MinimumFreeWeight=2000
; 次の3項目は旧版との設定互換用です。
RouteIdleFinishMs=1200
RouteSettleMs=700
SearchPulseMs=180

; FiveMのPIDと対象・インベントリNUIセッションを定期確認します。
; セッション変更は即時停止し、取得失敗は作業を止めて3回まで再確認します。
[Safety]
ServerHealthIntervalMs=3500

[Eating]
AutoEat=1
FoodKey=1
HungerCheckIntervalMs=3000
HungerConfirmFrames=3
HungerConfirmGapMs=90
FoodKeyHoldMs=90
EatAnimationMs=6500
GaugeSettleMs=1200
EatCooldownMs=45000
PostEatResumeMs=350

; 通常は変更不要です。単位はミリ秒です。
[Timings]
ResetWaitMs=180
AltBeforeRightMs=220
MenuOpenWaitMs=650
SearchTimeoutMs=1600
SearchPollMs=120
CursorSettleMs=60
HoverBeforeClickMs=180
LeftHoldMs=75
AfterLeftUpMs=120
RightToAltReleaseMs=120
MiningCompleteWaitMs=5200
StoneProbeSearchMs=500
StoneProbeRetryMs=300
StoneGoneConfirmations=3
StoneReadyConfirmations=2
StoneResyncAfterMs=12000
MarkerFallbackAfterMs=20000
NotFoundRetryMs=750
