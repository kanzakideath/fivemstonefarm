; AI採掘機 v9.1.1 設定テンプレート
; ActionMode: mining（採掘）/ washing（石洗い）/ gold（砂金採り）
[General]
ActionMode=mining
BackgroundMode=1
HideWhileRunning=1

[Controls]
StartHotkey=F8
StopHotkey=F9

; 更新先はアプリ内に固定されています。URLを設定する必要はありません。
[Updates]
Schema=1
AutoCheck=1

[Washing]
; 最初の正常な石洗いで、前後の所持品から1種類だけ減った実アイテムIDを自動学習します。
; サーバー固有IDを推測しません。既知の場合だけ手動指定できます（英数字・_・-）。
RawStoneItem=
; 補充はこの固定個数を無条件に取るのではなく、重量・スロット・作業用余裕から
; 実際に持てる上限を橋渡し側で毎回再計算します。1000000は実質「持てる限界」です。
RefillMaximum=1000000
; サーバー側の作業時間自体は短縮せず、進捗完了後の余分な固定待機だけを避けます。
; 旧版互換用です。通常の再実行は進捗完了と対象の再表示を監視します。
CycleMs=9000
; 収納・食事前に作業対象の再表示を待つ安全上の上限です。
ReadinessGraceMs=7000
; 洗浄報酬の確認後、サーバー側の後退アニメーションが完全に止まるまで入力を送らず待ちます。
PostCompletionSettleMs=1200
ForwardCorrection=1
ForwardPulseMs=100
ForwardSettleMs=250

[GoldPanning]
; 旧版互換用です。通常の再実行は進捗完了と対象の再表示を監視します。
CycleMs=6000
RecoveryEnabled=1
RecoveryAfterMs=12000
RecoveryPulseMs=150
RecoverySettleMs=300

; 「車両を登録」を押した後、登録する車両のストレージを一度手動で開きます。
; アプリがtrunkのStorageIdを端末内へ保存します。座標やサーバーresourceは使いません。
; StorageId・StorageTypeはアプリが検証して保存するため、手編集しないでください。
[VehicleStorage]
Enabled=0
Registered=0
DisplayName=登録車両
StorageId=
StorageType=
WorkMode=mining
; RouteFormat=5 / CompanionProtocol=0 がローカル車両登録の現行形式です。
; 旧座標・キー記録ルートとサーバーcompanion設定は再生しません。
RouteFormat=0
CompanionProtocol=0
CompanionRegistrationId=
; 次の2項目は旧版設定の安全な移行用です。現行版では車両移動に使用しません。
OutboundRoute=
ReturnRoute=
CapacityCheckIntervalMs=3000
; 残り重量がこの値以下になると収納を開始します（250～20000g）。
; 現在の各アイテムweight合計/maxWeightを主条件とし、全スロット使用は補助条件です。
MinimumFreeWeight=2000
; 現在重量/maxWeightがこの使用率以上なら収納します（50～99%、既定92%）。
StorageTriggerPercent=92
; 次の1回で増えると見込む重量です。これを受け取れない残り容量なら収納します（250～20000g）。
EstimatedRewardWeight=2000
; この数以下の空きスロットになった場合も収納します（0～10）。
MinimumFreeSlots=1
; 同じ登録荷台への収納を検証付きで再試行する上限です（1～8回）。
MaxRetries=5
; 収納・補充後のプレイヤー側と登録荷台側の個数変化を待つ上限です（1000～15000ms）。
VerifyTimeoutMs=5000
; RouteIdle/RouteSettleは旧版互換、SearchPulseは近距離探索の短い入力時間です。
RouteIdleFinishMs=1200
RouteSettleMs=700
SearchPulseMs=180

; FiveMのPIDと対象・インベントリNUIセッションを定期確認します。
; セッション変更は即時停止し、取得失敗は作業を止めて3回まで再確認します。
[Safety]
ServerHealthIntervalMs=3500
; 確認済みの作業報酬が増えない状態を許す上限です（15000～180000ms）。
FarmWatchdogMs=60000
; 作業ボタンを見失ってから視点・対象の自動復旧へ入る時間です（5000～60000ms）。
TargetLostRecoveryMs=15000
; 作業完了後、インベントリ差分による報酬確認を待つ上限です（1000～10000ms）。
RewardConfirmTimeoutMs=5000
; 1でFSM状態、task ID、再試行・判定理由をHUDとログへ詳しく表示します。
DebugOverlay=0

[Eating]
AutoEat=1
FoodKey=1
HungerCheckIntervalMs=3000
HungerConfirmFrames=3
HungerConfirmGapMs=90
FoodKeyHoldMs=90
EatAnimationMs=6500
GaugeSettleMs=1200
EatCooldownMs=45000
PostEatResumeMs=350
; FiveMが裏画面でゲージを読めない間は、開始1分後、その後8分ごとを上限に
; 指定スロットを試します。使用前後の個数が減った場合だけ食事成功に数えます。
BackgroundFallback=1
BackgroundFirstEatDelayMs=60000
BackgroundEatIntervalMs=480000
FailedEatRetryMs=30000

; 石洗い・砂金の各操作直前に視点を真下へ合わせ、実対象を再確認します。
; FiveMが前面なら相対マウス入力、別ウィンドウが前面ならFiveM DevConだけへ
; 期限付き入力を送り、作業中の別アプリへマウスやキーを送りません。
[ViewLock]
Enabled=1
DownPulseMs=450
ReapplyIntervalMs=4000
MouseStep=24
; 通常は-1。マウス反転設定でも未検出時に実行中だけ自動で反対方向を試します。
MouseDirection=-1

; 通常は変更不要です。単位はミリ秒です。
[Timings]
ResetWaitMs=180
AltBeforeRightMs=220
MenuOpenWaitMs=650
SearchTimeoutMs=1600
SearchPollMs=120
CursorSettleMs=60
HoverBeforeClickMs=180
LeftHoldMs=75
AfterLeftUpMs=120
RightToAltReleaseMs=120
; 旧版互換用です。採掘の完了は進捗UIから判定します。
MiningCompleteWaitMs=5200
StoneProbeSearchMs=500
StoneProbeRetryMs=300
StoneGoneConfirmations=3
StoneReadyConfirmations=2
StoneResyncAfterMs=12000
MarkerFallbackAfterMs=20000
NotFoundRetryMs=750
