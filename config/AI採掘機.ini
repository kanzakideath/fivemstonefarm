; AI採掘機 v5.2.0 設定テンプレート
; ActionMode: mining（採掘）/ washing（石洗い）/ gold（砂金採り）
[General]
ActionMode=mining
BackgroundMode=1
HideWhileRunning=1

[Controls]
StartHotkey=F8
StopHotkey=F9

; 更新先はアプリ内に固定されています。URLを設定する必要はありません。
[Updates]
Schema=1
AutoCheck=1

[Washing]
CycleMs=9000
ForwardCorrection=1
ForwardPulseMs=100
ForwardSettleMs=250

[GoldPanning]
CycleMs=6000

[Eating]
AutoEat=1
FoodKey=1
HungerCheckIntervalMs=3000
HungerConfirmFrames=3
HungerConfirmGapMs=90
FoodKeyHoldMs=90
EatAnimationMs=6500
GaugeSettleMs=1200
EatCooldownMs=45000
PostEatResumeMs=350

; 通常は変更不要です。単位はミリ秒です。
[Timings]
ResetWaitMs=180
AltBeforeRightMs=220
MenuOpenWaitMs=650
SearchTimeoutMs=1600
SearchPollMs=120
CursorSettleMs=60
HoverBeforeClickMs=180
LeftHoldMs=75
AfterLeftUpMs=120
RightToAltReleaseMs=120
MiningCompleteWaitMs=5200
StoneProbeSearchMs=500
StoneProbeRetryMs=300
StoneGoneConfirmations=3
StoneReadyConfirmations=2
StoneResyncAfterMs=12000
MarkerFallbackAfterMs=20000
NotFoundRetryMs=750
